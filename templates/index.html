<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Weather App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Weather App</h1>
        <form id="cityForm">
            <label for="cityInput" class="visually-hidden">City</label>
            <input type="text" id="cityInput" placeholder="Enter city name" autocomplete="off" required />
            <button type="submit">Search</button>
        </form>
        <p id="status" role="status" aria-live="polite"></p>
        <h2 id="place"></h2>
        <!-- Weather information display area -->
        <div id="weatherInfo" hidden>
            <div class="weather-box">
                <h2>Current temperature</h2>
                <p id="currentTemperature"></p>
            </div>
            <div class="weather-box">
                <h2>Feels like</h2>
                <p id="feelsLikeTemperature"></p>
            </div>
            <div class="weather-box">
                <h2>Air quality</h2>
                <p id="airQualityIndex"></p>
            </div>
            <div class="weather-box">
                <h2>Sunrise</h2>
                <p id="sunrise"></p>
            </div>
            <div class="weather-box">
                <h2>Sunset</h2>
                <p id="sunset"></p>
            </div>
        </div>
    </div>

    <script>
        const cityForm = document.getElementById('cityForm');
        const cityInput = document.getElementById('cityInput');
        const statusEl = document.getElementById('status');
        const place = document.getElementById('place');
        const weatherInfo = document.getElementById('weatherInfo');
        const els = {
            currentTemperature: document.getElementById('currentTemperature'),
            feelsLikeTemperature: document.getElementById('feelsLikeTemperature'),
            airQualityIndex: document.getElementById('airQualityIndex'),
            sunrise: document.getElementById('sunrise'),
            sunset: document.getElementById('sunset'),
        };

        // Show a time in the city's own timezone, not the visitor's
        function formatTime(unixSeconds, offsetSeconds) {
            if (!unixSeconds) return '—';
            const d = new Date((unixSeconds + offsetSeconds) * 1000);
            return `${String(d.getUTCHours()).padStart(2, '0')}:${String(d.getUTCMinutes()).padStart(2, '0')}`;
        }

        async function search(city) {
            statusEl.textContent = 'Loading…';
            try {
                const response = await fetch('/weather', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ cityInput: city }),
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Something went wrong.');

                place.textContent = `${data.city}${data.country ? ', ' + data.country : ''}${data.description ? ' · ' + data.description : ''}`;
                els.currentTemperature.textContent = `${data.currentTemperature}°C`;
                els.feelsLikeTemperature.textContent = `${data.feelsLikeTemperature}°C`;
                els.airQualityIndex.textContent = data.airQualityIndex ? `${data.airQualityIndex} · ${data.airQualityLabel}` : 'Not available';
                els.sunrise.textContent = formatTime(data.sunriseTime, data.timezoneOffset);
                els.sunset.textContent = formatTime(data.sunsetTime, data.timezoneOffset);
                weatherInfo.hidden = false;
                statusEl.textContent = '';
            } catch (err) {
                statusEl.textContent = err.message === 'Failed to fetch' ? 'Couldn’t reach the server.' : err.message;
            }
        }

        cityForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const city = cityInput.value.trim();
            if (city) search(city);
            cityInput.value = '';
        });

        search({{ default_city | tojson }});
    </script>
</body>
</html>
